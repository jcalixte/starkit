name = "starkit"
version = "0.1.0"

# JavaScript, not Erlang. Measured at roughly 5x faster to start for this workload — see
# docs/adr/0001-compile-gleam-to-javascript.md in the Starkit repo. The consequence is that this is
# not BEAM Gleam: no OTP, no actors, and no Erlang-only Hex packages.
target = "javascript"

# bun, not node — see docs/adr/0003-run-artefacts-on-bun.md. This line only affects `gleam test`;
# the Shelf spawns bun itself. It is here so tests run on the same runtime the Scripts will.
[javascript]
runtime = "bun"

[dependencies]
gleam_stdlib = ">= 0.60.0 and < 2.0.0"

# The protocol entry.gleam speaks to the Shelf. Both directions carry arbitrary text — a page title
# into Paste, an error into Notify — so escaping is a correctness problem, not a formatting one.
# Scripts never import this; it exists for the boundary.
gleam_json = ">= 3.0.0 and < 4.0.0"

# How a Script reaches the network, which it owns — the Shelf owns the machine and never fetches on
# a Script's behalf. There is no synchronous HTTP on this target, so these three arrive together:
# gleam_fetch wraps the runtime's own fetch, gleam_http is the Request it takes, and gleam_javascript
# is the Promise it answers with — the same Promise the Vocabulary's `Fetching` names.
#
# Deliberately not hand-rolled through @external: the ban on @external in a Script is what makes the
# Vocabulary the whole interface.
gleam_fetch = ">= 1.4.0 and < 2.0.0"
gleam_http = ">= 4.3.0 and < 5.0.0"
gleam_javascript = ">= 1.0.1 and < 2.0.0"

[dev-dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
