name = "starkit"
version = "0.1.0"

# JavaScript, not Erlang. Measured at roughly 5x faster to start for this workload — see
# docs/adr/0001-compile-gleam-to-javascript.md in the Starkit repo. The consequence is that this is
# not BEAM Gleam: no OTP, no actors, and no Erlang-only Hex packages.
target = "javascript"

# bun, not node — see docs/adr/0003-run-artefacts-on-bun.md. This line only affects `gleam test`;
# the Shelf spawns bun itself. It is here so tests run on the same runtime the Scripts will.
[javascript]
runtime = "bun"

[dependencies]
gleam_stdlib = ">= 0.60.0 and < 2.0.0"

# The protocol entry.gleam speaks to the Shelf. Both directions carry arbitrary text — a page
# title into Paste, an error into Notify — so escaping is a correctness problem, not a formatting
# one, and hand-rolling it would put a silent-corruption bug in Shelf-owned code. Scripts never
# import this; it exists for the boundary, which is why the dependency sits in a file the
# installer overwrites rather than in one you maintain.
gleam_json = ">= 3.0.0 and < 4.0.0"

[dev-dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
